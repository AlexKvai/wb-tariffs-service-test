version: '3.8'

services:
  db:
    image: postgres:16
    restart: always
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: postgres
    volumes:
      - pgdata:/var/lib/postgresql/data
    ports:
      - '5432:5432'

  app:
    build: .
    depends_on:
      - db
    environment:
      - DATABASE_URL=postgres://postgres:postgres@db:5432/postgres
      - WB_API_TOKEN=${WB_API_TOKEN}
      - GOOGLE_SHEETS_IDS=${GOOGLE_SHEETS_IDS}
    volumes:
      - .:/app
      - ./google-serviceaccount.json:/app/google-serviceaccount.json:ro 
    command: sh -c "npm run migrate && npm run start"
    restart: always

volumes:
  pgdata:
